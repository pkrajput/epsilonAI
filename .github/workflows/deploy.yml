name: Verify and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Build and smoke-test the site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax-check the server
        run: node --check server.js

      - name: Boot the server and smoke-test every route
        run: |
          node server.js &
          SERVER_PID=$!
          for i in $(seq 1 20); do
            curl -fsS http://localhost:3000/healthz >/dev/null 2>&1 && break
            sleep 0.5
          done
          curl -fsS http://localhost:3000/healthz | grep -q ok
          # Landing page must ship the decision map and link to the vision page.
          curl -fsS http://localhost:3000/ | grep -q 'id="graph"'
          curl -fsS http://localhost:3000/ | grep -q 'href="/vision"'
          # Vision page must serve the autonomous-company story and its module.
          curl -fsS http://localhost:3000/vision | grep -q 'The full autonomous company'
          curl -fsS http://localhost:3000/assets/codegraph-story.js | grep -q 'GitTraceCodegraphStory'
          # Why page and install guide must be served on their routes.
          curl -fsS http://localhost:3000/why | grep -q 'Why GitTRACE exists'
          curl -fsS http://localhost:3000/install | grep -q 'Install the CLI'
          kill "$SERVER_PID"

  deploy:
    name: Deploy to Render
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::warning::RENDER_DEPLOY_HOOK_URL secret is not set. Skipping the explicit deploy trigger." \
                 "If the Render service has 'Auto-Deploy' enabled for this repo, the push itself already deploys." \
                 "Otherwise add the secret: Render dashboard -> your service -> Settings -> Deploy Hook, then" \
                 "GitHub repo -> Settings -> Secrets and variables -> Actions -> new secret RENDER_DEPLOY_HOOK_URL."
            exit 0
          fi
          curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL"
          echo "Render deploy triggered."
